      responses:
        "200": { $ref: "#/components/responses/GrowthMeasurement" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/GrowthNotFound" }
        "422": { $ref: "#/components/responses/GrowthInvalid" }
