openapi: 3.1.0
info:
  title: Arunika API
  version: "1.0.0"
  description: |
    The contract between the Arunika backend and its two clients: the
    Flutter app and the backoffice admin panel.

    This document is the source of truth for which paths exist and which
    require authentication. tests/contract asserts it stays in step with
    routes/router.go in BOTH directions — a route added without a spec
    entry fails the suite, and so does a spec entry with no route. The
    clients each vendor a copy and assert every path they call appears
    here, which is what makes silent drift unmergeable.

    Security values were derived by probing the real router, not by hand:
    a route is bearerAuth if an anonymous request is rejected, and
    adminAuth if a valid non-admin token is additionally forbidden.
servers:
  - url: https://api.arunika.example
    description: Production
  - url: http://localhost:8080
    description: Local development
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by /auth/login or /auth/signup.
    adminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Admin access token issued by /admin/auth/login (role=admin).
  responses:
    Unauthorized:
      description: Missing, malformed, expired or revoked credentials.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated but not permitted.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Request failed validation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    GrowthNotFound:
      description: The child is not the caller's, or the measurement is not that child's (indistinguishable from missing).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GrowthError" }
    GrowthInvalid:
      description: The measurement cannot be stored.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GrowthError" }
    GrowthMeasurement:
      description: The measurement
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/GrowthMeasurement" }
    PremiumRequired:
      description: The letter needs an active Akses Premium subscription (code PREMIUM_REQUIRED).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GrowthError" }
    HurufNotFound:
      description: Unknown, unpublished or hidden letter, or a child that is not the caller's (indistinguishable from missing).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GrowthError" }
    HurufInvalid:
      description: Invalid progress (code INVALID_SCORE).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GrowthError" }
    HurufAdminError:
      description: >-
        Client error. 403 ROLE_REQUIRED (publisher-only action), 404
        LETTER_NOT_FOUND / VERSION_NOT_FOUND / ADMIN_NOT_FOUND, 409
        DRAFT_CONFLICT / LAST_PUBLISHER, 422 VALIDATION_FAILED (with fields),
        INVALID_ORDER, INVALID_ROLE or INVALID_ASSET.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              code: { type: string }
              fields:
                type: array
                items:
                  type: object
                  properties:
                    path: { type: string, example: dengar.word_audio_id }
                    code: { type: string, enum: [REQUIRED, TOO_LONG, INVALID, NOT_FOUND, WRONG_KIND, INVALID_PATH, ORDER_INVALID] }
    HurufDraft:
      description: The draft
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                allOf:
                  - { $ref: "#/components/schemas/HurufAdminLetter" }
                  - type: object
                    properties:
                      draft: { $ref: "#/components/schemas/HurufContent" }
                      draft_rev: { type: integer }
                      assets: { type: object, additionalProperties: { $ref: "#/components/schemas/Asset" } }
    HurufPublished:
      description: The new version
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  version: { type: integer }
                  published_at: { type: string, format: date-time }
    Asset:
      description: The asset
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/Asset" }
    AngkaNotFound:
      description: >-
        Unknown, unpublished or hidden number or level, an unknown session, or
        a child that is not the caller's (indistinguishable from missing).
        Codes NUMBER_NOT_FOUND, LEVEL_NOT_FOUND, SESSION_NOT_FOUND, CHILD_NOT_FOUND.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GrowthError" }
    AngkaLevelLocked:
      description: The level's prerequisite is not completed by the child (code LEVEL_LOCKED).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GrowthError" }
    AngkaInvalid:
      description: >-
        INVALID_TRY (a try that doesn't fit the session: a different answer for
        a recorded try, a skipped try, a try after a correct one, a wrong try
        after 50 wrong ones, or on a completed session) or SESSION_INCOMPLETE.
        A question stays open until it is answered correctly.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GrowthError" }
    AngkaAdminError:
      description: >-
        Client error. 403 ROLE_REQUIRED (publisher-only action), 404
        OBJECT_NOT_FOUND / NUMBER_NOT_FOUND / LEVEL_NOT_FOUND / VERSION_NOT_FOUND,
        409 DRAFT_CONFLICT / OBJECT_IN_USE / OBJECT_LAST_IN_LEVEL / LEVEL_IN_USE,
        422 VALIDATION_FAILED (with fields) or INVALID_ORDER.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              code: { type: string }
              fields:
                type: array
                items:
                  type: object
                  properties:
                    path: { type: string, example: range.max, description: "The draft field; numbers.N names a number without published audio" }
                    code:
                      type: string
                      enum: [REQUIRED, TOO_LONG, TOO_LARGE, NOT_TRANSPARENT, NOT_FOUND, WRONG_KIND, INVALID_URL,
                             NOT_PUBLISHED, OUT_OF_RANGE, LESS_THAN_MIN, INVALID, GREATER_THAN_THREE, LESS_THAN_TWO,
                             GREATER_THAN_QUESTIONS, CYCLE, NUMBER_AUDIO_MISSING]
    AngkaObjectDraft:
      description: The object draft
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                allOf:
                  - { $ref: "#/components/schemas/AngkaAdminObject" }
                  - type: object
                    properties:
                      draft: { $ref: "#/components/schemas/AngkaObjectContent" }
                      draft_rev: { type: integer }
                      assets: { type: object, additionalProperties: { $ref: "#/components/schemas/Asset" } }
    AngkaNumberDraft:
      description: The number draft
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/AngkaAdminNumber" }
    AngkaLevelDraft:
      description: The level draft
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                allOf:
                  - { $ref: "#/components/schemas/AngkaAdminLevel" }
                  - type: object
                    properties:
                      draft: { $ref: "#/components/schemas/AngkaLevelContent" }
                      draft_rev: { type: integer }
  schemas:
    HurufStroke:
      type: object
      properties:
        order: { type: integer, minimum: 1 }
        label: { type: string }
        path: { type: string, description: "One subpath of absolute M/L/Q/C on the 0..300 grid", example: "M150 30 L70 260" }
    HurufContent:
      type: object
      description: A letter's editable content (draft and published versions share this shape).
      properties:
        upper: { type: string }
        lower: { type: string }
        kenali:
          type: object
          properties:
            word: { type: string, maxLength: 20 }
            highlight: { type: array, items: { type: integer } }
            image_asset_id: { type: string, format: uuid, nullable: true }
            image_url: { type: string, description: "External https URL, used when image_asset_id is null" }
        dengar:
          type: object
          properties:
            letter_audio_id: { type: string, format: uuid, nullable: true }
            word_audio_id: { type: string, format: uuid, nullable: true }
            letter_audio_url: { type: string, description: "External https URL, used when letter_audio_id is null" }
            word_audio_url: { type: string, description: "External https URL, used when word_audio_id is null" }
        tebalkan: { $ref: "#/components/schemas/HurufTebalkan" }
        feedback: { $ref: "#/components/schemas/HurufFeedback" }
    HurufTebalkan:
      type: object
      properties:
        grid: { type: integer, example: 300 }
        lower_required: { type: boolean }
        upper: { type: array, items: { $ref: "#/components/schemas/HurufStroke" } }
        lower: { type: array, items: { $ref: "#/components/schemas/HurufStroke" } }
    HurufFeedback:
      type: object
      properties:
        success: { type: string, example: "Keren! Huruf A rapi!" }
        retry: { type: string, example: "Belum pas, ayo lagi!" }
        hint: { type: string }
    HurufLetter:
      type: object
      description: Letter content as the app renders it, assets resolved to URLs.
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        upper: { type: string }
        lower: { type: string }
        kenali:
          type: object
          properties:
            word: { type: string }
            highlight: { type: array, items: { type: integer } }
            image_url: { type: string }
        dengar:
          type: object
          properties:
            letter_audio_url: { type: string }
            word_audio_url: { type: string }
        tebalkan: { $ref: "#/components/schemas/HurufTebalkan" }
        feedback: { $ref: "#/components/schemas/HurufFeedback" }
    HurufManifest:
      type: object
      properties:
        premium: { type: boolean }
        letters:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              upper: { type: string }
              lower: { type: string }
              word: { type: string }
              image_url: { type: string }
              is_free: { type: boolean }
              locked: { type: boolean }
              version: { type: integer }
        tracing_thresholds:
          type: object
          properties:
            radius: { type: number, example: 22 }
            coverage: { type: number, example: 0.8 }
            accuracy: { type: number, example: 0.85 }
            direction: { type: number, example: 0.7 }
            start_tolerance: { type: number, example: 30 }
            max_failures: { type: integer, example: 3 }
    HurufProgress:
      type: object
      properties:
        letter_id: { type: string, format: uuid }
        kenali_done: { type: boolean }
        dengar_done: { type: boolean }
        tebalkan_done: { type: boolean }
        best_score: { type: number, nullable: true, minimum: 0, maximum: 1 }
        attempts: { type: integer }
        updated_at: { type: string, format: date-time }
    HurufProgressUpdate:
      type: object
      properties:
        kenali_done: { type: boolean }
        dengar_done: { type: boolean }
        tebalkan_done: { type: boolean }
        score: { type: number, minimum: 0, maximum: 1 }
        attempt: { type: boolean, description: Count one tracing attempt }
    HurufAdminLetter:
      type: object
      properties:
        id: { type: string, format: uuid }
        upper: { type: string }
        lower: { type: string }
        sort_order: { type: integer }
        is_free: { type: boolean }
        status: { type: string, enum: [draft, published, hidden] }
        has_unpublished_changes: { type: boolean }
        version: { type: integer, nullable: true }
        word: { type: string }
        image_url: { type: string }
        audio_count: { type: integer }
        stroke_count: { type: integer }
        updated_by: { type: string }
        updated_at: { type: string, format: date-time }
    Asset:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [image, audio] }
        url: { type: string }
        sha256: { type: string }
        mime: { type: string }
        bytes: { type: integer }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        duration_ms: { type: integer, nullable: true }
        has_alpha: { type: boolean, nullable: true, description: "Images: whether any pixel is see-through (null for images uploaded before it was recorded)" }
        original_name: { type: string }
        created_at: { type: string, format: date-time }
    AuditEntry:
      type: object
      properties:
        id: { type: integer }
        admin_id: { type: string, format: uuid }
        admin_email: { type: string }
        action: { type: string, example: publish }
        entity_type: { type: string, example: letter }
        entity_id: { type: string }
        before: { nullable: true }
        after: { nullable: true }
        created_at: { type: string, format: date-time }
    AdminRole:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { type: string, enum: [editor, publisher] }
    GrowthError:
      type: object
      properties:
        error: { type: string }
        code:
          type: string
          enum: [CHILD_NOT_FOUND, MEASUREMENT_NOT_FOUND, CLIENT_ID_CONFLICT, PROFILE_INCOMPLETE, DATE_OUT_OF_RANGE, VALUE_REQUIRED, INVALID_VALUE, INVALID_POSITION, OUTLIER_NEEDS_CONFIRM]
        indicators:
          description: For OUTLIER_NEEDS_CONFIRM, the implausible indicators.
          type: array
          items: { type: string, enum: [hfa, wfa] }
    GrowthMeasurementCreate:
      type: object
      required: [measured_on, position]
      properties:
        client_id: { type: string, format: uuid, description: Idempotency key; a retry returns the existing row. }
        measured_on: { type: string, format: date }
        height_cm: { type: [number, "null"], description: "One decimal. Height or weight, or both." }
        weight_kg: { type: [number, "null"] }
        position: { type: string, enum: [standing, recumbent] }
        confirm_outlier: { type: boolean, default: false, description: Store a value outside WHO flag limits. }
    GrowthMeasurementUpdate:
      type: object
      properties:
        measured_on: { type: string, format: date }
        height_cm: { type: [number, "null"] }
        weight_kg: { type: [number, "null"] }
        position: { type: string, enum: [standing, recumbent] }
        confirm_outlier: { type: boolean, default: false }
    GrowthIndicator:
      type: [object, "null"]
      description: Null when the measurement has no value for this indicator. z is internal; the app never shows it.
      properties:
        z: { type: [number, "null"], description: Null past 60 months. }
        category:
          type: string
          enum: [severely_stunted, stunted, normal, tall, severely_underweight, underweight, risk_overweight, out_of_range]
    GrowthMeasurement:
      type: object
      properties:
        id: { type: string, format: uuid }
        client_id: { type: [string, "null"], format: uuid }
        measured_on: { type: string, format: date }
        height_cm: { type: [number, "null"] }
        weight_kg: { type: [number, "null"] }
        position: { type: string, enum: [standing, recumbent] }
        age_days: { type: integer }
        age_label: { type: string, examples: ["3 tahun 2 bulan"] }
        hfa: { $ref: "#/components/schemas/GrowthIndicator" }
        wfa: { $ref: "#/components/schemas/GrowthIndicator" }
        flagged: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    GrowthLatestValue:
      type: [object, "null"]
      properties:
        value: { type: number }
        category: { type: [string, "null"] }
        measured_on: { type: string, format: date }
        delta_from_previous: { type: number, description: Omitted when there is no earlier value. }
    GrowthSummary:
      type: object
      properties:
        profile_complete: { type: boolean, description: False when the child's birth date or sex is missing or unrecognized. }
        child:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            sex: { type: string, enum: [male, female, ""] }
            birth_date: { type: string }
            age_label: { type: string }
            over_60_months: { type: boolean }
        latest_height: { $ref: "#/components/schemas/GrowthLatestValue" }
        latest_weight: { $ref: "#/components/schemas/GrowthLatestValue" }
        measurements:
          type: array
          items: { $ref: "#/components/schemas/GrowthMeasurement" }
    GrowthMetrics:
      type: object
      properties:
        days: { type: integer }
        active_parents: { type: integer }
        activated_parents: { type: integer }
        activation_rate: { type: number }
        habit_rate: { type: number }
        created_measurements: { type: integer }
        corrections_per_100: { type: number }
        outlier_confirmed_share: { type: number }
        category_distribution:
          type: object
          properties:
            hfa: { type: object, additionalProperties: { type: integer } }
            wfa: { type: object, additionalProperties: { type: integer } }
    AngkaRange:
      type: object
      properties:
        min: { type: integer, minimum: 1, maximum: 20 }
        max: { type: integer, minimum: 1, maximum: 20 }
    AngkaStars:
      type: object
      description: First-try correct answers needed for 3 and 2 stars.
      properties:
        three: { type: integer }
        two: { type: integer }
    AngkaLevelContent:
      type: object
      properties:
        name: { type: string }
        prerequisite_id: { type: string, format: uuid, nullable: true }
        range: { $ref: "#/components/schemas/AngkaRange" }
        question_count: { type: integer, minimum: 5, maximum: 20 }
        object_ids: { type: array, items: { type: string, format: uuid } }
        layout: { type: string, enum: [scatter, rows] }
        stars: { $ref: "#/components/schemas/AngkaStars" }
        feedback:
          type: object
          properties:
            success: { type: string }
            retry: { type: string }
            hint: { type: string, description: "{benda} is replaced by the question's object name" }
    AngkaObjectContent:
      type: object
      description: Each media slot holds an uploaded asset id or an external https URL; the asset id wins.
      properties:
        name: { type: string }
        question_text: { type: string }
        image_asset_id: { type: string, format: uuid, nullable: true }
        image_url: { type: string }
        question_audio_id: { type: string, format: uuid, nullable: true }
        question_audio_url: { type: string }
    AngkaNumberContent:
      type: object
      properties:
        name: { type: string }
        audio_asset_id: { type: string, format: uuid, nullable: true }
        audio_url: { type: string }
        object_id: { type: string, format: uuid, nullable: true }
    AngkaObject:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        question_text: { type: string }
        image_url: { type: string }
        question_audio_url: { type: string }
        hidden: { type: boolean }
    AngkaCountAudio:
      type: object
      description: Published audio URL of each number, keyed "1".."n", for counting aloud.
      additionalProperties: { type: string }
    AngkaManifest:
      type: object
      properties:
        premium: { type: boolean }
        numbers:
          type: array
          items:
            type: object
            properties:
              value: { type: integer }
              name: { type: string }
              is_free: { type: boolean }
              locked: { type: boolean }
        levels:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              range: { $ref: "#/components/schemas/AngkaRange" }
              question_count: { type: integer }
              prerequisite_id: { type: string, format: uuid, nullable: true, description: Set only when the prerequisite is itself visible }
              is_free: { type: boolean }
              locked: { type: boolean }
              version: { type: integer }
    AngkaNumber:
      type: object
      properties:
        value: { type: integer }
        name: { type: string }
        audio_url: { type: string }
        object: { allOf: [{ $ref: "#/components/schemas/AngkaObject" }], nullable: true }
        count_audio: { $ref: "#/components/schemas/AngkaCountAudio" }
    AngkaLevel:
      allOf:
        - { $ref: "#/components/schemas/AngkaLevelContent" }
        - type: object
          properties:
            id: { type: string, format: uuid }
            version: { type: integer }
            objects: { type: array, items: { $ref: "#/components/schemas/AngkaObject" } }
            count_audio: { $ref: "#/components/schemas/AngkaCountAudio" }
    AngkaAnswer:
      type: object
      properties:
        q: { type: integer, description: 1-based question number }
        tries: { type: array, items: { type: integer } }
    AngkaSession:
      type: object
      description: A session pinned to the level version, seed and objects it started with; the app regenerates its questions from these.
      properties:
        session_id: { type: string, format: uuid }
        level_id: { type: string, format: uuid }
        level_version: { type: integer }
        seed: { type: integer, format: int64, minimum: 0, maximum: 4294967295 }
        status: { type: string, enum: [in_progress, completed, abandoned] }
        object_ids: { type: array, items: { type: string, format: uuid } }
        answers: { type: array, items: { $ref: "#/components/schemas/AngkaAnswer" } }
        content: { $ref: "#/components/schemas/AngkaLevelContent" }
        objects: { type: array, items: { $ref: "#/components/schemas/AngkaObject" } }
        count_audio: { $ref: "#/components/schemas/AngkaCountAudio" }
    AngkaProgress:
      type: object
      properties:
        level_id: { type: string, format: uuid }
        best_stars: { type: integer, minimum: 0, maximum: 3 }
        completed: { type: boolean }
        current_session:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
            level_version: { type: integer }
            seed: { type: integer, format: int64 }
            object_ids: { type: array, items: { type: string, format: uuid } }
            answers: { type: array, items: { $ref: "#/components/schemas/AngkaAnswer" } }
            question_count: { type: integer }
            answered: { type: integer, description: Questions answered correctly or out of tries }
            updated_at: { type: string, format: date-time }
    AngkaAdminStatus:
      type: object
      properties:
        status: { type: string, enum: [draft, published, hidden] }
        has_unpublished_changes: { type: boolean }
        updated_by: { type: string }
        updated_at: { type: string, format: date-time }
    AngkaAdminObject:
      allOf:
        - { $ref: "#/components/schemas/AngkaAdminStatus" }
        - type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            question_text: { type: string }
            image_url: { type: string }
            question_audio_url: { type: string }
            used_in: { type: integer, description: Levels whose draft or any version use the object }
    AngkaAdminNumber:
      allOf:
        - { $ref: "#/components/schemas/AngkaAdminStatus" }
        - type: object
          properties:
            value: { type: integer }
            name: { type: string }
            audio_url: { type: string }
            object_id: { type: string, format: uuid, nullable: true }
            object_name: { type: string }
            object_image_url: { type: string }
            is_free: { type: boolean }
            draft: { $ref: "#/components/schemas/AngkaNumberContent" }
            draft_rev: { type: integer }
            assets: { type: object, additionalProperties: { $ref: "#/components/schemas/Asset" } }
    AngkaAdminLevel:
      allOf:
        - { $ref: "#/components/schemas/AngkaAdminStatus" }
        - type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            sort_order: { type: integer }
            is_free: { type: boolean }
            version: { type: integer, nullable: true }
            range: { $ref: "#/components/schemas/AngkaRange" }
            question_count: { type: integer }
            object_names: { type: array, items: { type: string } }
            stars: { $ref: "#/components/schemas/AngkaStars" }
            prerequisite_id: { type: string, format: uuid, nullable: true }
            prerequisite_sort_order: { type: integer, nullable: true }
            prerequisite_name: { type: string }
    Error:
      type: object
      properties:
        error: { type: string }
    AuthTokens:
      type: object
      required: [access_token, refresh_token, user_id]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        user_id: { type: string, format: uuid }
    SignUpResponse:
      type: object
      required: [name, phone_number, email, address, city, token, refresh_token]
      properties:
        name: { type: string }
        phone_number: { type: string }
        email: { type: string }
        address: { type: string }
        city: { type: string }
        child: { type: array, items: { type: object } }
        token: { type: string }
        refresh_token: { type: string }
    UserProfile:
      type: object
      required: [id, name, email_address, email_verified]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone_number: { type: string }
        email_address: { type: string }
        address: { type: string }
        city: { type: string }
        email_verified:
          type: boolean
          description: Gates password-reset delivery only; never content or purchases.
        is_subscribed: { type: boolean }
        consent_required:
          type: boolean
          description: True when the user has not accepted the current version of every legal document (UU PDP); the app blocks on a consent screen until POST /user/consent.
        children: { type: array, items: { type: object } }
      description: The password hash is deliberately never serialized.
    ConsentInput:
      type: object
      required: [terms_version, privacy_version, parental_version]
      properties:
        terms_version: { type: string, example: "2026-10-01" }
        privacy_version: { type: string, example: "2026-10-01" }
        parental_version:
          type: string
          example: "2026-10-01"
          description: Version of the parent/guardian declaration consenting to processing of the child's data.
      description: The document versions the client showed the user when they accepted.
    Order:
      type: object
      required: [id, status, amount_idr]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, PAID, FAILED, EXPIRED, REFUNDED] }
        amount_idr: { type: integer, format: int64 }
        provider: { type: string, enum: [midtrans, google_play] }
        product_id: { type: string, format: uuid }
        package_id: { type: string, format: uuid }
    PaymentMetric:
      type: object
      required: [status, count, total]
      properties:
        status:
          type: string
          description: An order status, not a subscription status.
        count: { type: integer, format: int64 }
        total:
          type: integer
          format: int64
          description: Gross value of the group in whole rupiah.
