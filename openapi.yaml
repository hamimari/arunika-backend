  /learn/huruf/manifest:
    get:
      tags: [huruf]
      summary: Published Belajar Huruf letters for the caller, with lock state and tracing thresholds
      description: >-
        Carries an ETag over the whole body (it changes on any publish, reorder,
        hide, free-letter change, threshold change or the caller's premium
        status). Send it back in If-None-Match for a 304.
      operationId: getlearn_huruf_manifest
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: If-None-Match, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: The manifest
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/HurufManifest" }
        "304": { description: Unchanged since the given ETag }
        "401": { $ref: "#/components/responses/Unauthorized" }
