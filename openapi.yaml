              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/GrowthSummary" }
        "404": { $ref: "#/components/responses/GrowthNotFound" }
  /children/{childId}/growth/measurements:
    parameters:
      - { name: childId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [growth]
      summary: Add a measurement; the server computes age, z-scores and categories
      operationId: postchildren_childid_growth_measurements
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GrowthMeasurementCreate" }
      responses:
        "201": { $ref: "#/components/responses/GrowthMeasurement" }
        "200":
          description: A measurement with this client_id already exists; it is returned unchanged
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/GrowthMeasurement" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/GrowthNotFound" }
        "409":
          description: client_id already used for another child
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrowthError" }
        "422": { $ref: "#/components/responses/GrowthInvalid" }
