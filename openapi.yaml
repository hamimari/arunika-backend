  /admin/assets:
    post:
      tags: [admin]
      summary: Upload an image (PNG/WebP, square, ≤ 500 KB) or audio (MP3/AAC, ≤ 300 KB, ≤ 10 s)
      description: The type is decided from the file's bytes. The same bytes uploaded again return the existing asset (200).
      operationId: postadmin_assets
      security: [{ adminAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, kind]
              properties:
                file: { type: string, format: binary }
                kind: { type: string, enum: [image, audio] }
      responses:
        "201": { $ref: "#/components/responses/Asset" }
        "200": { $ref: "#/components/responses/Asset" }
        "422":
          description: The file was refused
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  code: { type: string, enum: [INVALID_ASSET] }
                  reason: { type: string, enum: [UNSUPPORTED_TYPE, TOO_LARGE, NOT_SQUARE, TOO_LONG, UNREADABLE] }
        "4XX": { $ref: "#/components/responses/HurufAdminError" }
