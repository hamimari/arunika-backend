              properties:
                draft: { $ref: "#/components/schemas/HurufContent" }
                draft_rev: { type: integer }
      responses:
        "200": { $ref: "#/components/responses/HurufDraft" }
        "4XX": { $ref: "#/components/responses/HurufAdminError" }
