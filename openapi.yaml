      operationId: getlearn_huruf_letters_id
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The letter
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/HurufLetter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PremiumRequired" }
        "404": { $ref: "#/components/responses/HurufNotFound" }
