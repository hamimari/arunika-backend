    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [admin]
      summary: Make a dongeng free or premium
      description: >-
        Flips only the free flag; the product, its orders and earlier buyers'
        entitlements are untouched, so it is reversible. is_free is required:
        an absent value is a 400, never "false". Saving the item with PUT
        never changes this flag. 404 when the item does not exist.
      operationId: patchadmin_content_fairy_tales_id_free
      security: [{ adminAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_free]
              properties:
                is_free: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  is_free: { type: boolean }
        "4XX":
          description: Client error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
