        The three global promotional strike-price rules (AR_CARD, DONGENG,
        PACKAGE) with mode, value, starts_at, ends_at and a computed status
        (OFF, SCHEDULED, ACTIVE, ENDED).
      operationId: getadmin_strike_price_rules
