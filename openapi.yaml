  /admin/orders/{id}/refund:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [admin]
      summary: Refund a Google Play order
      description: >-
        Body {reason, refund_type}. reason is required (at least 10 characters);
        refund_type is FULL (default) or PRORATED (subscriptions only). One-time
        purchases use orders.refund with revoke; subscriptions use
        subscriptionsv2.revoke. On success the order becomes REFUNDED and access is
        removed. 400 invalid input, 409 not refundable or already refunded, 502
        when Google refuses (the refund is recorded as FAILED).
      operationId: postadmin_orders_id_refund
      security: [{ adminAuth: [] }]
      responses:
        "2XX":
          description: Success
          content:
            application/json:
              schema: { type: object }
        "4XX":
          description: Client error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
