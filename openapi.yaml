      - name: scope
        in: path
        required: true
        schema: { type: string, enum: [AR_CARD, DONGENG, PACKAGE] }
    put:
      tags: [admin]
      summary: Update admin strike-price-rules
      description: >-
        Body {mode, value, starts_at, ends_at}. mode is NONE, PERCENT (value
        1-90) or FIXED (value >= 1); PERCENT/FIXED need an ends_at in the
        future, after starts_at, at most 90 days out. 404 for an unknown scope,
        400 for an invalid rule.
      operationId: putadmin_strike_price_rules_scope
      security: [{ adminAuth: [] }]
