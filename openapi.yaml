      - { name: childId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [angka]
      summary: Stars, completion and the in-progress session per level for one of the caller's children
      operationId: getchildren_childid_angka_progress
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Progress rows, most recently updated first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AngkaProgress" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/AngkaNotFound" }
  /children/{childId}/angka/sessions:
    parameters:
      - { name: childId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [angka]
      summary: Start a level, or resume the child's in-progress session on it (unless restart)
      description: Checks the child (404), the level (404), access (402), then the prerequisite (409), in that order.
      operationId: postchildren_childid_angka_sessions
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level_id]
              properties:
                level_id: { type: string, format: uuid }
                restart: { type: boolean, description: Abandon the in-progress session and start a new one }
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AngkaSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PremiumRequired" }
        "404": { $ref: "#/components/responses/AngkaNotFound" }
        "409": { $ref: "#/components/responses/AngkaLevelLocked" }
  /children/{childId}/angka/sessions/{id}:
    parameters:
      - { name: childId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [angka]
      summary: Record one try; repeating a recorded try with the same answer is a no-op
      description: Only ownership is checked, not access, so a level started before a subscription ended can be finished.
      operationId: patchchildren_childid_angka_sessions_id
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [q, try, answer]
              properties:
                q: { type: integer, minimum: 1 }
                try: { type: integer, minimum: 1 }
                answer: { type: integer, minimum: 0, maximum: 99 }
      responses:
        "200":
          description: The recorded try and the server's verdict
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      q: { type: integer }
                      try: { type: integer }
                      correct: { type: boolean }
                      finished: { type: boolean, description: "Correct, or no tries left" }
                      answers: { type: array, items: { $ref: "#/components/schemas/AngkaAnswer" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/AngkaNotFound" }
        "422": { $ref: "#/components/responses/AngkaInvalid" }
  /children/{childId}/angka/sessions/{id}/complete:
    parameters:
      - { name: childId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [angka]
      summary: Score a finished session from its recorded tries and update progress (idempotent)
      operationId: postchildren_childid_angka_sessions_id_complete
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The server's result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      stars: { type: integer, minimum: 1, maximum: 3 }
                      first_correct: { type: integer }
                      best_stars: { type: integer }
                      unlocked_level_ids: { type: array, items: { type: string, format: uuid } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/AngkaNotFound" }
        "422": { $ref: "#/components/responses/AngkaInvalid" }
  /media/huruf/{file}:
    parameters:
      - { name: file, in: path, required: true, schema: { type: string } }
    get:
      tags: [huruf]
      summary: Uploaded media file (local storage driver only; production serves media from the R2 custom domain)
      operationId: getmedia_huruf_file
      security: []
      responses:
        "200":
          description: The file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { description: No such file }
