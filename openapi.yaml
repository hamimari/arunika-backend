    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [admin]
      summary: List an order's refunds
      description: >-
        Refund records (admin-issued and Google-initiated), newest first, with
        the issuing admin's email and Google's refunded amounts and state.
      operationId: getadmin_orders_id_refunds
      security: [{ adminAuth: [] }]
      responses:
        "2XX":
          description: Success
          content:
            application/json:
              schema: { type: object }
        "4XX":
          description: Client error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
