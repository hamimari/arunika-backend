      tags: [admin]
      summary: Backoffice audit entries, newest first
      operationId: getadmin_audit-log
      security: [{ adminAuth: [] }]
      parameters:
        - { name: entity_type, in: query, required: false, schema: { type: string } }
        - { name: entity_id, in: query, required: false, schema: { type: string } }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1 } }
        - { name: per_page, in: query, required: false, schema: { type: integer, default: 20 } }
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                type: object
                properties:
