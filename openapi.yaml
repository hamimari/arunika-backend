    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [admin]
      summary: Sync refund details from Google
      description: >-
        Re-reads the refund's details (amounts, state, reason) with orders.get,
        and completes a refund Google accepted but that was left REQUESTED.
      operationId: postadmin_order_refunds_id_sync
      security: [{ adminAuth: [] }]
      responses:
        "2XX":
          description: Success
          content:
            application/json:
              schema: { type: object }
