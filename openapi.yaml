      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [growth]
      summary: Edit a measurement; omitted fields are kept, null clears a value
      operationId: patchchildren_childid_growth_measurements_id
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
