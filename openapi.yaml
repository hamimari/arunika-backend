openapi: 3.1.0
info:
  title: Arunika API
  version: "1.0.0"
  description: |
    The contract between the Arunika backend and its two clients: the
    Flutter app and the backoffice admin panel.

    This document is the source of truth for which paths exist and which
    require authentication. tests/contract asserts it stays in step with
    routes/router.go in BOTH directions — a route added without a spec
    entry fails the suite, and so does a spec entry with no route. The
    clients each vendor a copy and assert every path they call appears
    here, which is what makes silent drift unmergeable.

    Security values were derived by probing the real router, not by hand:
    a route is bearerAuth if an anonymous request is rejected, and
    adminAuth if a valid non-admin token is additionally forbidden.
servers:
  - url: https://api.arunika.example
    description: Production
  - url: http://localhost:8080
    description: Local development
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by /auth/login or /auth/signup.
    adminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Admin access token issued by /admin/auth/login (role=admin).
  responses:
    Unauthorized:
      description: Missing, malformed, expired or revoked credentials.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated but not permitted.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Request failed validation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    AuthTokens:
      type: object
      required: [access_token, refresh_token, user_id]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        user_id: { type: string, format: uuid }
    SignUpResponse:
      type: object
      required: [name, phone_number, email, address, city, token, refresh_token]
      properties:
        name: { type: string }
        phone_number: { type: string }
        email: { type: string }
        address: { type: string }
        city: { type: string }
        child: { type: array, items: { type: object } }
        token: { type: string }
        refresh_token: { type: string }
    UserProfile:
      type: object
      required: [id, name, email_address, email_verified]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone_number: { type: string }
        email_address: { type: string }
        address: { type: string }
        city: { type: string }
        email_verified:
          type: boolean
          description: Gates password-reset delivery only; never content or purchases.
        is_subscribed: { type: boolean }
        children: { type: array, items: { type: object } }
      description: The password hash is deliberately never serialized.
    Order:
      type: object
      required: [id, status, amount_idr]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, PAID, FAILED, EXPIRED, REFUNDED] }
        amount_idr: { type: integer, format: int64 }
        provider: { type: string, enum: [midtrans, google_play] }
        product_id: { type: string, format: uuid }
        package_id: { type: string, format: uuid }
    PaymentMetric:
      type: object
      required: [status, count, total]
      properties:
        status:
          type: string
          description: An order status, not a subscription status.
        count: { type: integer, format: int64 }
        total:
          type: integer
          format: int64
          description: Gross value of the group in whole rupiah.
