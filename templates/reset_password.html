<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .loader {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #f97316;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>

<body class="min-h-screen bg-gray-100 flex items-center justify-center px-4">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
    
    <!-- Logo -->
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-orange-500">Arunika</h1>
      <p class="text-gray-500 text-sm mt-1">Reset Password</p>
    </div>

    <!-- Error -->
    <div id="errorBox" class="hidden mb-4 p-3 rounded-lg bg-red-100 text-red-600 text-sm"></div>

    <!-- Success -->
    <div id="successBox" class="hidden mb-4 p-3 rounded-lg bg-green-100 text-green-600 text-sm"></div>

    <!-- Form -->
    <form id="resetForm" class="space-y-4">

    <div>
        <label class="text-sm font-medium text-gray-700">New Password</label>
        <div class="relative">
            <input
            id="password"
            type="password"
            required
            minlength="8"
            class="w-full mt-1 px-4 py-3 pr-12 rounded-lg border border-gray-300 focus:ring-2 focus:ring-orange-400 focus:outline-none"
            placeholder="Min 8 characters"
            />
            <button type="button" onclick="togglePassword('password', 'eye1')" 
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500">
            <svg id="eye1" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
                viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7
                    -1.274 4.057-5.064 7-9.542 7
                    -4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
            </button>
        </div>
    </div>

    <div>
    <label class="text-sm font-medium text-gray-700">Confirm Password</label>
    <div class="relative">
        <input
        id="confirmPassword"
        type="password"
        required
        minlength="8"
        class="w-full mt-1 px-4 py-3 pr-12 rounded-lg border border-gray-300 focus:ring-2 focus:ring-orange-400 focus:outline-none"
        placeholder="Repeat password"
        />
        <button type="button" onclick="togglePassword('confirmPassword', 'eye2')" 
        class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500">
        <svg id="eye2" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
            viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7
                -1.274 4.057-5.064 7-9.542 7
                -4.477 0-8.268-2.943-9.542-7z"/>
        </svg>
        </button>
    </div>
    </div>


      <button
        type="submit"
        id="submitBtn"
        class="w-full bg-orange-500 hover:bg-orange-600 text-white py-3 rounded-lg font-semibold flex items-center justify-center gap-2 transition"
      >
        <span id="btnText">Reset Password</span>
        <div id="loader" class="loader hidden"></div>
      </button>
    </form>

    <div class="text-center text-xs text-gray-400 mt-6">
      © Arunika
    </div>
  </div>

<script>
/* ================================
   CONFIG
================================ */
// This page is served by the backend at the same path the POST API lives at
// (GET vs POST on /reset-password), so it always points at whichever host
// and protocol actually served it — no hardcoded host, works unchanged in
// dev/staging/prod, and inherits HTTPS automatically when served over it.
const API_URL = window.location.origin + "/reset-password";

/* ================================
   TOKEN PARSE
================================ */
const params = new URLSearchParams(window.location.search);
const token = params.get("token");

const errorBox = document.getElementById("errorBox");
const successBox = document.getElementById("successBox");
const form = document.getElementById("resetForm");
const loader = document.getElementById("loader");
const btnText = document.getElementById("btnText");

if (!token) {
  showError("Invalid or missing reset token.");
  form.classList.add("hidden");
}

/* ================================
   UI HELPERS
================================ */
function showError(msg) {
  errorBox.innerText = msg;
  errorBox.classList.remove("hidden");
}

function showSuccess(msg) {
  successBox.innerText = msg;
  successBox.classList.remove("hidden");
}

function setLoading(isLoading) {
  if (isLoading) {
    loader.classList.remove("hidden");
    btnText.innerText = "Processing...";
  } else {
    loader.classList.add("hidden");
    btnText.innerText = "Reset Password";
  }
}

/* ================================
   SUBMIT HANDLER
================================ */
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorBox.classList.add("hidden");
  successBox.classList.add("hidden");

  const password = document.getElementById("password").value.trim();
  const confirm = document.getElementById("confirmPassword").value.trim();

  if (password.length < 8) {
    showError("Password must be at least 8 characters.");
    return;
  }

  if (password !== confirm) {
    showError("Passwords do not match.");
    return;
  }

  setLoading(true);

  try {
    console.log(token);
    const res = await fetch(API_URL + "?token=" + token, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        new_password: password
      })
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.message || "Reset failed");
    }

    showSuccess("Password reset successful. You can now login.");
    form.classList.add("hidden");

    // Optional redirect
    // setTimeout(() => {
    //   window.location.href = "http://localhost:8080";
    // }, 2000);

  } catch (err) {
    showError(err.message || "Something went wrong");
  } finally {
    setLoading(false);
  }
});

function togglePassword(inputId, eyeId) {
  const input = document.getElementById(inputId);
  const eye = document.getElementById(eyeId);

  if (input.type === "password") {
    input.type = "text";
    eye.innerHTML = `
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M13.875 18.825A10.05 10.05 0 0112 19
           c-4.478 0-8.268-2.943-9.542-7
           a9.956 9.956 0 012.042-3.368M6.223 6.223
           A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7
           a9.97 9.97 0 01-4.293 5.093M15 12a3 3 0 00-3-3
           m0 0a3 3 0 00-3 3m3-3L3 3m18 18L9 9"/>
    `;
  } else {
    input.type = "password";
    eye.innerHTML = `
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M2.458 12C3.732 7.943 7.523 5 12 5
           c4.478 0 8.268 2.943 9.542 7
           -1.274 4.057-5.064 7-9.542 7
           -4.477 0-8.268-2.943-9.542-7z"/>
    `;
  }
}
</script>

</body>
</html>
