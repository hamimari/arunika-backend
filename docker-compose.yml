version: '3.8'

services:
  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: arunika_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-arunika}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-arunika}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-arunika} -d ${DB_NAME:-arunika}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: arunika_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-}
      --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Flyway (DB migrations) ──────────────────────────────────────────────────
  flyway:
    image: flyway/flyway:10-alpine
    container_name: arunika_flyway
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      -url=jdbc:postgresql://postgres:5432/${DB_NAME:-arunika}
      -user=${DB_USER:-arunika}
      -password=${DB_PASSWORD:-changeme}
      -locations=filesystem:/flyway/sql
      -connectRetries=5
      migrate
    volumes:
      - ./db/migrations:/flyway/sql
      - ./db/seeds:/flyway/seeds

  # ─── Backend API ─────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arunika_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Backoffice (Admin UI) ────────────────────────────────────────────────────
  backoffice:
    build:
      context: ../arunika_backoffice
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: arunika_backoffice
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${BACKOFFICE_PORT:-3000}:80"

volumes:
  pgdata:
  redisdata:
