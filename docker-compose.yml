version: '3.8'

services:
  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: arunika_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-arunika}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-arunika}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-arunika} -d ${DB_NAME:-arunika}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: arunika_redis
    restart: unless-stopped
    # `--requirepass ${REDIS_PASSWORD:-}` used to collapse to
    # `--requirepass --appendonly yes` when REDIS_PASSWORD is unset (the
    # empty substitution just vanishes, merging the two flags) — redis-server
    # then reads "--appendonly" as the password value and fails to parse
    # "yes" as a second argument. Only pass --requirepass when a password is
    # actually configured.
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes
        else
          exec redis-server --appendonly yes
        fi
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      # Host-side port only (for local redis-cli access) — the app container
      # always talks to this over the internal compose network as
      # "redis:6379" regardless of what's published here. Mapped to 6380 on
      # the host because another, unrelated Redis container already owns the
      # host's 6379.
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Flyway (DB migrations) ──────────────────────────────────────────────────
  flyway:
    image: flyway/flyway:10-alpine
    container_name: arunika_flyway
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      -url=jdbc:postgresql://postgres:5432/${DB_NAME:-arunika}
      -user=${DB_USER:-arunika}
      -password=${DB_PASSWORD:-changeme}
      -locations=filesystem:/flyway/sql
      -connectRetries=5
      migrate
    volumes:
      - ./db/migrations:/flyway/sql
      - ./db/seeds:/flyway/seeds

  # ─── Backend API ─────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arunika_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Backoffice (Admin UI) ────────────────────────────────────────────────────
  backoffice:
    build:
      context: ../arunika-backoffice
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: arunika_backoffice
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${BACKOFFICE_PORT:-3000}:80"

volumes:
  pgdata:
  redisdata:
